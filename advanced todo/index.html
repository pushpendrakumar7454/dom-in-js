<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<main>
    <div class="top topleft"></div>
    <div class="top bottomright"></div>

    <section class="section">
        <div class="upper">
            <div class="toptext">
            <h1 class="pro">TaskFlow Pro</h1>
            <p class="manage">Manage your task efficiently</p>
        </div>
        <div class="divbottom">
            <div class="totaltask">
                <h3 class="center" id="totaltask">0</h3>
                <p class="ttt">Total Tasks</p>
            </div>
            <div class="totaltask">
                <h3 class="center" id="completedtask">0</h3>
                <p class="ttt">Completed</p>
            </div>
              <div class="totaltask">
                <h3 class="center" id="pendingtask">0</h3>
                <p class="pen ttt" >Pending</p>
            </div>
        </div>
        </div>
       <div class="all">
         <div  class="taskadd">
             <form>
                <input type="text" placeholder="What need to be done today?">
            <button>+Add Task</button>
             </form>
        </div>
       </div>
       <div class="pipe">
        <h2>Browser Rendering Pipeline</h2>
       </div>
       <div class="bottommain">
       <div class="parenttask"> 
       
    </div>
        
       </div>
    </section>
    
</main>
<script src="script.js"></script>    
</body>
</html>
