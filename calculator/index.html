<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="parent">
            <div class="inp_div2">
            </div>
            <div class="inp_div">
                <input type="text">
            </div>
            <div class="div-btn">
                <button>C</button>
                <button>.</button>
                <button class="xbtn">%</button>
                <button class="xbtn">/</button>
            </div>
             <div class="div-btn">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="xbtn">X</button>
            </div>
             <div class="div-btn">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="xbtn">-</i></button>
            </div>
             <div class="div-btn">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="xbtn">+</button>
            </div>
             <div class="div-btn">
                <button>0</button>
                <button>00</button>
                <button>=</button>
                <button id="bton">Clear</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
