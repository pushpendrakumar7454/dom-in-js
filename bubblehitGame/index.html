<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Bubble hit game</title>
</head>
<body>
    <main>
        <section>
            <header>
                <div class="flex"><h3>Hit:<span class="newhit overall">0</span></h3></div>
                <div class="flex"><h3>Timer:<span class="timer overall">60</span></h3></div>
                <div class="flex"><h3>Score:<span class="score overall">0</span></h3></div>
                <div class="flex"><h3>highScore:<span class="highscore overall">0</span></h3></div>
            </header>
            <div class="parent">
       
            </div> 

        </section>
       <div class="overlay1">
        <button class="start">START GAME</button>

       </div>
       <div class="overlay2">
        <h1>GAME OVER</h1>
        <button class="restart">RESTART GAME</button>

       </div>
    </main>
<script src="script.js"></script>    
</body>
</html>
